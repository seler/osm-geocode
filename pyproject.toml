[project]
name = "osm-geocode"
version = "0.3.0"
description = "Reverse Geocoding Sensor for Home Assistant based on OSM Nominatim"
requires-python = ">=3.12"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "requests-mock>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
